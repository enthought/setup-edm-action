name: CI

on: [pull_request, workflow_dispatch]

jobs:
  main:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install EDM
        uses: ./
        with:
          # No macOS build of EDM 4.1.7 exists (EDM is supported on Linux and Windows); macOS tests the last version that has one.
          edm-version: ${{ runner.os == 'macOS' && '4.1.0' || '4.1.7' }}
      - name: Show EDM versions
        run: edm versions
